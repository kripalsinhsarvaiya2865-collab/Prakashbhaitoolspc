<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Expense Manager Premium</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <style>
        :root {
            --primary: #4F46E5; /* Premium Indigo */
            --primary-light: #EEF2FF;
            --danger: #EF4444; 
            --success: #10B981; 
            --warning: #F59E0B;
            --bg-color: #F9FAFB; 
            --nav-bg: #ffffff; 
            --text-main: #111827; 
            --text-muted: #6B7280;
            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --premium-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-color); 
            margin: 0; padding: 0; 
            display: flex; flex-direction: column; 
            height: 100vh; color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }
        
        .app-header { 
            background-color: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: var(--text-main); 
            padding: 18px 24px; 
            font-size: 18px; font-weight: 800; 
            position: fixed; top: 0; width: 100%; z-index: 100; 
            box-sizing: border-box; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .app-content { margin-top: 70px; margin-bottom: 95px; padding: 20px; flex-grow: 1; overflow-y: auto; }
        
        .page { display: none; transition: all 0.3s ease; }
        .page.active { display: block; animation: fadeIn 0.4s ease; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card { 
            background-color: white; border-radius: 16px; padding: 20px; 
            box-shadow: var(--card-shadow); margin-bottom: 20px; 
            border: 1px solid rgba(0,0,0,0.02);
        }

        h3 { font-weight: 700; letter-spacing: -0.02em; margin-bottom: 18px; font-size: 1.1rem; }

        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
        
        select, input { 
            width: 100%; padding: 14px; border: 1.5px solid #F3F4F6; border-radius: 12px; 
            font-size: 15px; font-family: 'Inter', sans-serif; box-sizing: border-box; 
            background-color: #F9FAFB; transition: all 0.2s ease;
            color: var(--text-main);
            height: 48px; /* Ensure uniform height for all inputs/selects */
        }
        select:focus, input:focus { outline: none; border-color: var(--primary); background-color: white; box-shadow: 0 0 0 4px var(--primary-light); }

        .row-flex { display: flex; gap: 12px; } .row-flex .form-group { flex: 1; }

        /* Reports Filter Grid */
        .filter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
        .full-row { grid-column: span 2; }

        button { transition: all 0.2s active; cursor: pointer; }
        button:active { transform: scale(0.97); }

        button.primary-btn { 
            width: 100%; padding: 16px; background-color: var(--primary); color: white; border: none; 
            border-radius: 14px; font-size: 16px; font-weight: 700; 
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);
            height: 54px;
        }
        button.danger-btn { background-color: #FEF2F2; color: var(--danger); border: none; padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 13px; }
        button.warning-btn { background-color: #FFFBEB; color: #B45309; border: none; padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 13px; }
        button.success-btn { background-color: var(--success); color: white; border: none; padding: 12px; border-radius: 12px; font-weight: 600; width: 100%; box-shadow: 0 4px 6px rgba(16, 185, 129, 0.2); height: 48px; }
        
        .bottom-nav { 
            position: fixed; bottom: 15px; left: 15px; right: 15px; height: 75px;
            background-color: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(10px);
            display: flex; justify-content: space-around; padding: 10px 0; 
            box-shadow: var(--premium-shadow); z-index: 100; 
            border-radius: 24px; border: 1px solid rgba(0,0,0,0.05);
            box-sizing: border-box;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #9CA3AF; text-decoration: none; font-size: 10px; font-weight: 600; cursor: pointer; width: 25%; transition: all 0.3s ease;}
        .nav-item .material-icons { font-size: 28px; margin-bottom: 4px; transition: all 0.3s ease;}
        .nav-item.active { color: var(--primary); }

        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid #F3F4F6; }
        
        .data-card { 
            background: white; border-radius: 18px; padding: 20px; margin-bottom: 16px; 
            box-shadow: var(--card-shadow); border: 1px solid rgba(0,0,0,0.03);
            position: relative; overflow: hidden;
        }
        .data-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--primary); opacity: 0.8; }
        
        .data-card-header { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
        .data-card-title { font-weight: 800; font-size: 17px; margin-bottom: 4px; color: var(--text-main); letter-spacing: -0.02em; }
        .data-card-subtitle { font-size: 14px; font-weight: 500; color: var(--text-muted); margin-bottom: 18px;}
        .data-card-amount { font-size: 20px; font-weight: 800; color: var(--primary); letter-spacing: -0.03em; }
        
        .total-banner { background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%); color: white; padding: 18px; border-radius: 16px; text-align: center; font-weight: 800; font-size: 20px; margin-bottom: 20px; box-shadow: 0 10px 20px rgba(79, 70, 229, 0.2); }
        
        #loader { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(255,255,255,0.9); z-index: 999; display: flex; flex-direction: column; justify-content: center; align-items: center; font-weight: 700; color: var(--primary); display: none;}
        
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body>

    <div class="app-header">
        <span>Expense Management</span>
        <i class="material-icons" onclick="initAppData()" style="color: var(--primary); font-size: 26px;">sync</i>
    </div>
    
    <div id="loader">
        <div style="width: 40px; height: 40px; border: 4px solid var(--primary-light); border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px;"></div>
        <span>UPDATING CLOUD</span>
    </div>
    <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>

    <div class="app-content">

        <div id="page-entry" class="page active">
            <div class="card">
                <h3 id="form-title" style="color: var(--primary);">New Entry</h3>
                <form id="expense-form">
                    <input type="hidden" id="edit-id" value="">
                    <div class="row-flex">
                        <div class="form-group">
                            <label>Period</label>
                            <select id="month" required>
                                <option value="January">January</option><option value="February">February</option><option value="March">March</option>
                                <option value="April">April</option><option value="May">May</option><option value="June">June</option>
                                <option value="July">July</option><option value="August">August</option><option value="September">September</option>
                                <option value="October">October</option><option value="November">November</option><option value="December">December</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>&nbsp;</label>
                            <select id="year" required></select>
                        </div>
                    </div>
                    <div class="form-group"><label>Company Entity</label><select id="company" required></select></div>
                    <div class="form-group"><label>Recipient / Payee</label><select id="payee" required></select></div>
                    <div class="form-group"><label>Expense Category</label><select id="category" required></select></div>
                    <div class="form-group"><label>Transaction Amount (₹)</label><input type="number" id="amount" min="1" step="1" placeholder="0.00" required></div>
                    
                    <div style="margin-top: 10px;">
                        <button type="submit" id="submit-btn" class="primary-btn">Save Entry</button>
                        <button type="button" id="cancel-edit-btn" class="danger-btn" style="display:none; width:100%; margin-top:10px;" onclick="resetExpenseForm()">Cancel Changes</button>
                    </div>
                </form>
                <div id="message"></div>
            </div>

            <div class="card" style="text-align: center; background: linear-gradient(to bottom, #ffffff, #F9FAFB);">
                <label>Available Balance</label>
                <h1 id="wallet-balance" style="font-size: 38px; font-weight: 900; margin: 8px 0 25px 0; color: var(--text-main); letter-spacing: -0.04em;">₹ 0.00</h1>
                
                <div class="row-flex">
                    <div class="form-group" style="flex:1;"><input type="number" id="w-amt" placeholder="₹ Amount"></div>
                    <div class="form-group" style="flex:1.5;"><input type="text" id="w-remark" placeholder="Note"></div>
                </div>
                <div class="row-flex">
                    <button class="success-btn" onclick="processWallet('add')" style="background-color: #10B981;">Deposit</button>
                    <button class="danger-btn" onclick="processWallet('remove')" style="background-color: #FEE2E2; color: #B91C1C; width: 100%; border-radius: 12px; font-weight: 700;">Withdraw</button>
                </div>
            </div>
        </div>

        <div id="page-reports" class="page">
            <div class="card" style="background-color: #F3F4F6; border: none; padding: 15px;">
                <div class="filter-grid">
                    <select id="r-month" onchange="renderReports()"><option value="All">All Months</option></select>
                    <select id="r-year" onchange="renderReports()"><option value="All">All Years</option></select>
                    <select id="r-comp" onchange="renderReports()"><option value="All">All Companies</option></select>
                    <select id="r-payee" onchange="renderReports()"><option value="All">All Payees</option></select>
                    <select id="r-cat" onchange="renderReports()" class="full-row"><option value="All">All Categories</option></select>
                </div>
            </div>
            <div class="total-banner" id="report-total">₹ 0.00</div>
            <div id="reports-container"></div>
        </div>

        <div id="page-wallet" class="page">
            <h3 style="padding-left: 5px;">Transaction History</h3>
            <div id="wallet-history-container"></div>
        </div>
        
        <div id="page-masters" class="page">
            <div class="form-group">
                <label>Managing Database</label>
                <select id="master-selector" onchange="renderMasters()" style="background-color: white;">
                    <option value="companies">Companies</option>
                    <option value="payees">Payees</option>
                    <option value="categories">Categories</option>
                </select>
            </div>
            <div class="card">
                <div class="row-flex">
                    <input type="text" id="master-input" placeholder="New item name...">
                    <button class="primary-btn" style="width:auto; padding:0 25px; border-radius: 12px; box-shadow: none;" onclick="addMaster()">Add</button>
                </div>
            </div>
            <div id="masters-container"></div>
        </div>

    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchPage('entry', 'Management')"><i class="material-icons">add_circle</i><span>Entry</span></div>
        <div class="nav-item" onclick="switchPage('reports', 'Analysis')"><i class="material-icons">analytics</i><span>Reports</span></div>
        <div class="nav-item" onclick="switchPage('wallet', 'History')"><i class="material-icons">account_balance_wallet</i><span>Wallet</span></div>
        <div class="nav-item" onclick="switchPage('masters', 'Settings')"><i class="material-icons">dashboard_customize</i><span>Master</span></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            projectId: "expense-manager-sync",
            appId: "1:717226692754:web:581b0f8d76d2bdda4e964b",
            storageBucket: "expense-manager-sync.firebasestorage.app",
            apiKey: "AIzaSyCWDSr2VSv9-FQQjuWFvr0Rvblent5Nr08",
            authDomain: "expense-manager-sync.firebaseapp.com",
            messagingSenderId: "717226692754",
            projectNumber: "717226692754"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let masterData = { companies: {}, payees: {}, categories: {} };
        let expensesList = [];
        let walletList = [];
        let currentBalance = 0;

        function getSafeMillis(ts) {
            if (!ts) return 0;
            if (typeof ts === 'string') return new Date(ts).getTime() || 0;
            return ts.toMillis ? ts.toMillis() : (ts.toDate ? ts.toDate().getTime() : 0);
        }

        function getSafeDateString(ts) {
            if (!ts) return "N/A";
            if (typeof ts === 'string') return ts;
            return ts.toDate ? ts.toDate().toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'}) : "N/A";
        }

        window.switchPage = function(pageId, title) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page-' + pageId).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            event.currentTarget.classList.add('active');
            window.scrollTo(0,0);
        };

        const showLoader = (show) => document.getElementById('loader').style.display = show ? 'flex' : 'none';
        const showMsg = (text, type) => {
            const m = document.getElementById('message'); m.innerText = text; m.className = type; m.style.display = 'block';
            m.style.padding = "14px"; m.style.borderRadius = "12px"; m.style.marginTop = "15px"; m.style.fontSize = "14px";
            setTimeout(() => m.style.display = 'none', 3000);
        };

        const monthsArr = ['January','February','March','April','May','June','July','August','September','October','November','December'];
        const currentMonth = new Date().toLocaleString('default', { month: 'long' });
        const currentYear = new Date().getFullYear();
        
        document.getElementById('month').value = currentMonth;
        ['year', 'r-year'].forEach(id => {
            let s = document.getElementById(id);
            if (id === 'r-year') {
                s.innerHTML = '<option value="All">All Years</option>';
                for(let i=2020; i<=2030; i++) s.add(new Option(i, i));
            } else {
                for(let i=2020; i<=2030; i++) s.add(new Option(i, i, false, i === currentYear));
            }
        });
        
        let rMonth = document.getElementById('r-month');
        monthsArr.forEach(m => rMonth.add(new Option(m, m)));

        window.initAppData = async function() {
            showLoader(true);
            try {
                for(let type of ['companies', 'payees', 'categories']) {
                    masterData[type] = {};
                    const snap = await getDocs(collection(db, type));
                    snap.forEach(d => { masterData[type][d.id] = d.data().name; });
                }
                updateDropdowns();

                walletList = []; currentBalance = 0;
                const wSnap = await getDocs(collection(db, "wallet_transactions"));
                wSnap.forEach(d => {
                    let w = d.data(); w.id = d.id; walletList.push(w);
                    if(w.type === 'add') currentBalance += parseFloat(w.amount);
                    else currentBalance -= parseFloat(w.amount);
                });
                
                walletList.sort((a,b) => getSafeMillis(b.created_at) - getSafeMillis(a.created_at));
                document.getElementById('wallet-balance').innerText = `₹${currentBalance.toLocaleString('en-IN', {minimumFractionDigits: 2})}`;
                renderWalletHistory();

                expensesList = [];
                const eSnap = await getDocs(collection(db, "expenses"));
                eSnap.forEach(d => {
                    let e = d.data(); e.id = d.id;
                    e.company_name = masterData.companies[e.company_id] || "Unknown";
                    e.payee_name = masterData.payees[e.payee_id] || "Unknown";
                    e.category_name = masterData.categories[e.category_id] || "Unknown";
                    expensesList.push(e);
                });
                
                expensesList.sort((a,b) => (b.year - a.year) || (getSafeMillis(b.created_at) - getSafeMillis(a.created_at)));
                renderReports(); renderMasters();
            } catch(e) { console.error(e); alert("Cloud connection failed: " + e.message); }
            showLoader(false);
        };

        function updateDropdowns() {
            const types = { 'company': 'companies', 'payee': 'payees', 'category': 'categories' };
            for(let [elId, mType] of Object.entries(types)) {
                let s = document.getElementById(elId); s.innerHTML = '<option value="">Select...</option>';
                Object.entries(masterData[mType]).sort((a,b)=>(a[1]||"").localeCompare(b[1]||"")).forEach(([id, name]) => s.add(new Option(name, id)));
            }
            let sC = document.getElementById('r-comp'); sC.innerHTML='<option value="All">All Companies</option>'; Object.values(masterData.companies).sort().forEach(n=>sC.add(new Option(n,n)));
            let sCat = document.getElementById('r-cat'); sCat.innerHTML='<option value="All">All Categories</option>'; Object.values(masterData.categories).sort().forEach(n=>sCat.add(new Option(n,n)));
            let sp = document.getElementById('r-payee'); sp.innerHTML='<option value="All">All Payees</option>'; Object.values(masterData.payees).sort().forEach(n=>sp.add(new Option(n,n)));
        }

        async function getNextVoucherNo(companyId, month, year) {
            const monthsEarly = ['January', 'February', 'March'];
            const fyStartYear = monthsEarly.includes(month) ? year - 1 : year;
            let maxV = 0;
            const q = query(collection(db, "expenses"), where("company_id", "==", companyId));
            const snap = await getDocs(q);
            snap.forEach(doc => {
                const d = doc.data(); const docY = parseInt(d.year); const docM = d.month;
                if ((docY === fyStartYear && !monthsEarly.includes(docM)) || (docY === fyStartYear + 1 && monthsEarly.includes(docM))) {
                    if (d.voucher_no > maxV) maxV = d.voucher_no;
                }
            });
            return maxV + 1;
        }

        window.resetExpenseForm = function() {
            document.getElementById('expense-form').reset();
            document.getElementById('month').value = currentMonth; document.getElementById('year').value = currentYear;
            document.getElementById('edit-id').value = "";
            document.getElementById('form-title').innerText = "New Entry";
            document.getElementById('submit-btn').innerText = "Save Entry";
            document.getElementById('cancel-edit-btn').style.display = "none";
        };

        document.getElementById('expense-form').addEventListener('submit', async (e) => {
            e.preventDefault(); showLoader(true);
            try {
                const editId = document.getElementById('edit-id').value;
                const cId = document.getElementById('company').value;
                const pId = document.getElementById('payee').value;
                const catId = document.getElementById('category').value;
                const amt = parseFloat(document.getElementById('amount').value);
                const mon = document.getElementById('month').value;
                const yr = parseInt(document.getElementById('year').value);

                let docData = { month: mon, year: yr, company_id: cId, payee_id: pId, category_id: catId, amount: amt };

                if(editId) {
                    await updateDoc(doc(db, "expenses", editId), docData);
                    const wSnap = await getDocs(query(collection(db, "wallet_transactions"), where("expense_id", "==", editId)));
                    wSnap.forEach(async (wd) => { await updateDoc(doc(db, "wallet_transactions", wd.id), { amount: amt, remark: `Exp: ${masterData.categories[catId]}` }); });
                    showMsg("Database Updated", "success"); resetExpenseForm();
                } else {
                    const vNo = await getNextVoucherNo(cId, mon, yr);
                    docData.voucher_no = vNo; docData.created_at = serverTimestamp();
                    const newDoc = await addDoc(collection(db, "expenses"), docData);
                    await addDoc(collection(db, "wallet_transactions"), { type: 'expense', amount: amt, remark: `Exp: ${masterData.categories[catId]}`, expense_id: newDoc.id, created_at: serverTimestamp() });
                    showMsg(`Entry Created: #${vNo}`, "success"); resetExpenseForm();
                }
                initAppData(); 
            } catch(err) { showMsg("Cloud Error", "error"); showLoader(false);}
        });

        window.startEditExpense = function(id) {
            const exp = expensesList.find(e => e.id === id); if(!exp) return;
            document.getElementById('month').value = exp.month; document.getElementById('year').value = exp.year;
            document.getElementById('company').value = exp.company_id; document.getElementById('payee').value = exp.payee_id;
            document.getElementById('category').value = exp.category_id; document.getElementById('amount').value = exp.amount;
            document.getElementById('edit-id').value = exp.id;
            document.getElementById('form-title').innerText = "Edit Record";
            document.getElementById('submit-btn').innerText = "Update Record";
            document.getElementById('cancel-edit-btn').style.display = "block";
            window.scrollTo(0,0);
            switchPage('entry', 'Management');
        };

        window.deleteExpense = async function(id) {
            if(!confirm("Are you sure you want to delete this record?")) return;
            showLoader(true);
            try {
                await deleteDoc(doc(db, "expenses", id));
                const wSnap = await getDocs(query(collection(db, "wallet_transactions"), where("expense_id", "==", id)));
                wSnap.forEach(async (wd) => await deleteDoc(doc(db, "wallet_transactions", wd.id)));
                initAppData();
            } catch(e) { alert("Error deleting."); showLoader(false); }
        };

        window.renderReports = function() {
            const fm=document.getElementById('r-month').value, fy=document.getElementById('r-year').value, fc=document.getElementById('r-comp').value, fp=document.getElementById('r-payee').value, fcat=document.getElementById('r-cat').value;
            let html = "", total = 0;
            expensesList.filter(e => (fm==="All"||e.month===fm) && (fy==="All"||e.year==fy) && (fc==="All"||e.company_name===fc) && (fp==="All"||e.payee_name===fp) && (fcat==="All"||e.category_name===fcat))
            .forEach(e => {
                total += e.amount;
                html += `<div class="data-card">
                    <div class="data-card-header"><span>${e.month} ${e.year}</span><span class="data-card-amount">₹${e.amount.toLocaleString('en-IN')}</span></div>
                    <div class="data-card-title">${e.company_name}</div><div class="data-card-subtitle">${e.category_name} &bull; ${e.payee_name}</div>
                    <div class="action-btns" style="display:flex; gap:10px;">
                        <button class="warning-btn" onclick="startEditExpense('${e.id}')">Edit</button>
                        <button class="danger-btn" onclick="deleteExpense('${e.id}')">Delete</button>
                    </div>
                </div>`;
            });
            document.getElementById('report-total').innerText = `₹${total.toLocaleString('en-IN', {minimumFractionDigits:2})}`;
            document.getElementById('reports-container').innerHTML = html || "<div style='text-align:center; padding:40px; color:gray; font-weight:500;'>No records match filters.</div>";
        };

        window.processWallet = async function(type) {
            let amt = parseFloat(document.getElementById('w-amt').value); let rem = document.getElementById('w-remark').value;
            if(!amt || amt<=0) return alert("Please enter a valid amount.");
            if(type === 'remove' && amt > currentBalance) return alert("Insufficient balance in wallet.");
            showLoader(true);
            try {
                await addDoc(collection(db, "wallet_transactions"), { type: type, amount: amt, remark: rem, created_at: serverTimestamp() });
                document.getElementById('w-amt').value=""; document.getElementById('w-remark').value="";
                initAppData();
            } catch(e) { showLoader(false); }
        };

        window.renderWalletHistory = function() {
            let html = "";
            walletList.forEach(w => {
                let color = w.type === 'add' ? 'var(--success)' : (w.type === 'expense' ? '#9CA3AF' : 'var(--danger)');
                let icon = w.type === 'add' ? 'add_circle' : (w.type === 'expense' ? 'receipt' : 'remove_circle');
                let dt = getSafeDateString(w.created_at);
                html += `<div class="card" style="padding:15px; margin-bottom:12px;">
                    <div style="display:flex; align-items:center; justify-content:space-between;">
                        <div style="display:flex; align-items:center; gap:12px;">
                            <i class="material-icons" style="color:${color}; font-size:24px;">${icon}</i>
                            <div>
                                <div style="font-weight:700; font-size:14px;">${w.type.toUpperCase()}</div>
                                <div style="font-size:12px; color:var(--text-muted);">${w.remark || 'Direct Transaction'} &bull; ${dt}</div>
                            </div>
                        </div>
                        <div style="font-weight:800; font-size:15px; color:${w.type==='add'?'var(--success)':'var(--text-main)'};">${w.type==='add'?'+':'-'} ₹${parseFloat(w.amount).toLocaleString('en-IN')}</div>
                    </div>
                </div>`;
            });
            document.getElementById('wallet-history-container').innerHTML = html || "<div style='text-align:center; padding:40px; color:gray;'>No activity found.</div>";
        };

        window.renderMasters = function() {
            const type = document.getElementById('master-selector').value;
            let html = "";
            Object.entries(masterData[type]).sort((a,b)=>(a[1]||"").localeCompare(b[1]||"")).forEach(([id, name]) => {
                html += `<div class="list-item">
                    <div style="font-weight:600; color:var(--text-main);">${name}</div>
                    <div class="action-btns" style="display:flex; gap:15px;">
                        <i class="material-icons" style="color:var(--text-muted); cursor:pointer; font-size:20px;" onclick="editMaster('${type}', '${id}', '${name}')">edit</i>
                        <i class="material-icons" style="color:#FCA5A5; cursor:pointer; font-size:20px;" onclick="deleteMaster('${type}', '${id}', '${name}')">delete_outline</i>
                    </div>
                </div>`;
            });
            document.getElementById('masters-container').innerHTML = html || "<div style='text-align:center; padding:40px; color:gray;'>Category list is empty.</div>";
        };

        window.addMaster = async function() {
            const type = document.getElementById('master-selector').value; const val = document.getElementById('master-input').value.trim();
            if(!val) return; showLoader(true);
            try { await addDoc(collection(db, type), {name: val}); document.getElementById('master-input').value=""; initAppData(); } 
            catch(e) { showLoader(false); }
        };

        window.editMaster = async function(type, id, oldName) {
            let newName = prompt(`Rename ${type.slice(0,-1)}:`, oldName);
            if(newName && newName.trim() !== oldName) {
                showLoader(true);
                try { await updateDoc(doc(db, type, id), {name: newName.trim()}); initAppData(); } 
                catch(e) { showLoader(false); }
            }
        };

        window.deleteMaster = async function(type, id, name) {
            if(!confirm(`Permanently remove "${name}" from database?`)) return; showLoader(true);
            try { await deleteDoc(doc(db, type, id)); initAppData(); } 
            catch(e) { showLoader(false); }
        };

        initAppData();

    </script>
</body>
</html>
